<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:640px;background:#141312;overflow:hidden;position:relative;
       font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#fff}
  .glow{position:absolute;width:900px;height:900px;left:-260px;top:-320px;border-radius:50%;
        background:radial-gradient(circle,rgba(208,52,44,.55),rgba(208,52,44,0) 62%)}
  .grain{position:absolute;inset:0;opacity:.12;
         background-image:radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px);
         background-size:3px 3px}
  .left{position:absolute;left:78px;top:112px;width:620px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .seal{width:38px;height:38px;border-radius:50%;background:#d0342c;display:grid;place-items:center;
        font-weight:800;font-size:16px;color:#fff;box-shadow:0 8px 24px rgba(208,52,44,.45)}
  .brand span{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#b9b2a8;font-weight:700}
  h1{font-size:74px;line-height:1.02;letter-spacing:-.035em;font-weight:800;margin-bottom:20px}
  h1 em{color:#d0342c;font-style:normal}
  p{font-size:19px;line-height:1.5;color:#c9c2b8;max-width:520px}
  .chips{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 16px;font-size:13.5px;color:#e7e1d7}
  .chip.red{border-color:rgba(208,52,44,.6);color:#ff8f84}
  .right{position:absolute;right:78px;top:56px;width:262px;height:620px}
  .phone{border-radius:36px;overflow:hidden;border:1px solid rgba(255,255,255,.16);
         box-shadow:0 40px 90px rgba(0,0,0,.6);transform:rotate(-3deg)}
  .phone img{display:block;width:100%}
  .phone{-webkit-mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,0) 99%);
         mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,0) 99%)}
  .tag{position:absolute;left:78px;bottom:56px;font-size:12px;letter-spacing:.2em;
       text-transform:uppercase;color:#6f6a63;font-weight:700}
</style></head>
<body>
  <div class="glow"></div><div class="grain"></div>

  <div class="left">
    <div class="brand"><span class="seal">Y</span><span>Teq Studio</span></div>
    <h1>Yalan<br>Makinası</h1>
    <p>Bağlama göre üç alternatif bahane, yakalanma riski ve karşı tarafın soracağı soruların provası.</p>
    <div class="chips">
      <span class="chip red">1-10 yalan şiddeti</span>
      <span class="chip">risk ölçer</span>
      <span class="chip">soru provası</span>
      <span class="chip">yalan defteri</span>
    </div>
  </div>

  <div class="right">
    <div class="phone"><img src="../screenshots/03-deste.png" alt=""></div>
  </div>

  <div class="tag">Android · web · yapay zekâ destekli</div>
</body></html>
