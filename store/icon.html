<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:512px;height:512px;background:#d0342c}
  .wrap{width:512px;height:512px;background:#d0342c;display:grid;place-items:center;position:relative;
        font-family:'Inter','Segoe UI',system-ui,sans-serif}
  .ring{position:absolute;width:360px;height:360px;border-radius:50%;border:6px solid rgba(255,255,255,.28)}
  .y{color:#fff;font-size:300px;font-weight:800;letter-spacing:-.05em;line-height:.9;margin-top:-14px}
</style></head><body>
  <div class="wrap"><div class="ring"></div><span class="y">Y</span></div>
</body></html>
