<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1024px;height:500px;background:#141312;color:#fff;position:relative;overflow:hidden;
       font-family:'Inter','Segoe UI',system-ui,sans-serif}
  .glow{position:absolute;width:800px;height:800px;left:-240px;top:-280px;border-radius:50%;
        background:radial-gradient(circle,rgba(208,52,44,.55),rgba(208,52,44,0) 62%)}
  .left{position:absolute;left:64px;top:96px;width:520px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .seal{width:32px;height:32px;border-radius:50%;background:#d0342c;display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b9b2a8;font-weight:700}
  h1{font-size:60px;line-height:1;letter-spacing:-.035em;font-weight:800;margin-bottom:16px}
  p{font-size:17px;line-height:1.5;color:#c9c2b8;max-width:430px}
  .phone{position:absolute;right:70px;top:44px;width:196px;border-radius:26px;overflow:hidden;
         border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 70px rgba(0,0,0,.6);transform:rotate(-3deg)}
  .phone img{display:block;width:100%}
</style></head><body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand"><span class="seal">Y</span><span>Teq Studio</span></div>
    <h1>Yalan Makinası</h1>
    <p>Üç alternatif bahane, yakalanma riski ve karşı tarafın soracağı soruların provası.</p>
  </div>
  <div class="phone"><img src="../docs/screenshots/03-deste.png" alt=""></div>
</body></html>
